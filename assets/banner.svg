
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="50%" stop-color="#EDE5FF"/>
      <stop offset="100%" stop-color="#DFEEFF"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8856B5"/>
      <stop offset="100%" stop-color="#587DCB"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="24" fill="url(#background)"/>

  <!-- Decorative elements -->
  <g fill="#FFFFFF" opacity=".75">
    <circle cx="75" cy="62" r="4"/>
    <circle cx="130" cy="205" r="3"/>
    <circle cx="900" cy="70" r="4"/>
    <circle cx="940" cy="190" r="3"/>
    <circle cx="815" cy="220" r="4"/>
    <circle cx="330" cy="55" r="3"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="2" opacity=".65" fill="none">
    <path d="M95 100 l0 -14 m-7 7 h14"/>
    <path d="M890 155 l0 -14 m-7 7 h14"/>
    <path d="M760 45 l0 -12 m-6 6 h12"/>
  </g>

  <!-- Subtle code decorations -->
  <g font-family="monospace" font-weight="bold" fill="#9A84C5" opacity=".28">
    <text x="65" y="150" font-size="30">&lt;/&gt;</text>
    <text x="900" y="115" font-size="26">{ }</text>
    <text x="830" y="210" font-size="18">;</text>
  </g>

  <!-- Main greeting -->
  <text x="500" y="108"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="29"
        font-weight="600"
        fill="#51416C"
        textLength="730"
        lengthAdjust="spacingAndGlyphs">
    Olá, eu sou o Lucas! Bem-vindo(a) ao meu perfil!
  </text>

  <!-- Name -->
  <text x="500" y="169"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="54"
        font-weight="800"
        fill="url(#title)">
    Lucas Mir
  </text>

  <!-- Subtitle -->
  <text x="500" y="205"
        text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="22"
        font-weight="600"
        fill="#75658E">
    Mir Bytes
  </text>

  <!-- Decorative line -->
  <rect x="405" y="222" width="190" height="3" rx="2" fill="#BCA6E5"/>
</svg>
