
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="50%" stop-color="#e9ddff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24243b"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" rx="24" fill="url(#bg)"/>

  <!-- Decorative stars -->
  <g fill="#ffffff" opacity=".85">
    <path d="M95 45 L101 59 L115 65 L101 71 L95 85 L89 71 L75 65 L89 59 Z"/>
    <path d="M440 35 L444 45 L454 49 L444 53 L440 63 L436 53 L426 49 L436 45 Z"/>
    <path d="M535 245 L540 257 L552 261 L540 265 L535 277 L531 265 L519 261 L531 257 Z"/>
    <circle cx="390" cy="85" r="4"/>
    <circle cx="490" cy="180" r="3"/>
    <circle cx="60" cy="210" r="4"/>
    <circle cx="560" cy="65" r="3"/>
  </g>

  <!-- Character shadow -->
  <ellipse cx="180" cy="265" rx="135" ry="15" fill="#8b7aa9" opacity=".18"/>

  <!-- Character: hair -->
  <path d="M105 128
           C92 84 121 49 167 48
           C207 45 239 76 239 118
           L231 166 L111 166 Z"
        fill="#30263a"/>

  <!-- Neck -->
  <rect x="155" y="148" width="48" height="53" rx="18" fill="#d99b77"/>

  <!-- Face -->
  <ellipse cx="181" cy="124" rx="62" ry="72" fill="#efbd99"/>

  <!-- Hair fringe -->
  <path d="M120 108
           C112 64 144 46 179 52
           C215 51 239 78 239 107
           C224 99 212 85 205 74
           C192 93 165 104 144 108
           C137 111 128 112 120 108 Z"
        fill="#30263a"/>

  <!-- Ears -->
  <ellipse cx="120" cy="128" rx="12" ry="19" fill="#e7ae8b"/>
  <ellipse cx="242" cy="128" rx="12" ry="19" fill="#e7ae8b"/>

  <!-- Eyes -->
  <ellipse cx="158" cy="126" rx="5" ry="7" fill="#30263a"/>
  <ellipse cx="202" cy="126" rx="5" ry="7" fill="#30263a"/>

  <!-- Eyebrows -->
  <path d="M148 112 Q158 106 167 112" fill="none" stroke="#493446" stroke-width="4" stroke-linecap="round"/>
  <path d="M193 112 Q204 106 213 112" fill="none" stroke="#493446" stroke-width="4" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M180 128 L176 142 Q181 146 187 142" fill="none" stroke="#c48668" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M166 155 Q181 166 196 155" fill="none" stroke="#975d58" stroke-width="3" stroke-linecap="round"/>

  <!-- Hoodie -->
  <path d="M112 190
           L145 174
           Q165 190 180 190
           Q195 190 214 174
           L246 190
           Q268 210 278 265
           L87 265
           Q94 210 112 190 Z"
        fill="#7462a8"/>

  <!-- Hoodie details -->
  <path d="M145 178 Q180 211 215 178" fill="none" stroke="#d4c9f2" stroke-width="5"/>
  <path d="M180 203 L180 252" stroke="#d4c9f2" stroke-width="3" opacity=".8"/>
  <circle cx="174" cy="226" r="3" fill="#d4c9f2"/>
  <circle cx="186" cy="226" r="3" fill="#d4c9f2"/>

  <!-- Arm -->
  <path d="M230 201 Q252 208 259 229 L238 246 Q226 222 209 218 Z" fill="#7461a7"/>

  <!-- Desk -->
  <rect x="30" y="264" width="530" height="12" rx="6" fill="#c79aaf" opacity=".65"/>

  <!-- Coffee cup -->
  <g transform="translate(43 205)">
    <ellipse cx="28" cy="55" rx="28" ry="7" fill="#a98a9d" opacity=".25"/>
    <rect x="6" y="15" width="43" height="40" rx="8" fill="#fff7ed"/>
    <path d="M49 24 Q70 20 65 39 Q61 52 49 50" fill="none" stroke="#fff7ed" stroke-width="8"/>
    <ellipse cx="27.5" cy="15" rx="21.5" ry="7" fill="#7b4a35"/>
    <ellipse cx="27.5" cy="15" rx="17" ry="4.5" fill="#a66c49"/>
    <path d="M20 4 Q14 -4 21 -11" fill="none" stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"/>
    <path d="M34 4 Q28 -5 35 -12" fill="none" stroke="#fff" stroke-width="3" opacity=".55" stroke-linecap="round"/>
  </g>

  <!-- MacBook shadow -->
  <ellipse cx="372" cy="270" rx="135" ry="8" fill="#8b7aa9" opacity=".25"/>

  <!-- MacBook screen -->
  <g>
    <rect x="260" y="163" width="215" height="113" rx="12" fill="#333344"/>
    <rect x="268" y="171" width="199" height="96" rx="6" fill="url(#screen)"/>
    <circle cx="367" cy="166" r="2" fill="#a9a9bd"/>

    <!-- Code on screen -->
    <g font-family="monospace" font-size="10" opacity=".95">
      <text x="282" y="192" fill="#d7b8ff">&lt;developer&gt;</text>
      <text x="282" y="208" fill="#8dd6ff">Olá, mundo!</text>
      <text x="282" y="224" fill="#f5b5d7">System.out.println</text>
      <text x="282" y="240" fill="#b6e3a8">("Lucas");</text>
      <text x="282" y="256" fill="#d7b8ff">&lt;/developer&gt;</text>
    </g>

    <!-- Laptop base -->
    <path d="M250 276 L485 276 L505 286 Q508 290 497 292 L238 292 Q228 290 234 286 Z"
          fill="#bfc4d3"/>
    <path d="M320 278 L415 278 L409 282 L327 282 Z" fill="#9da4b7"/>
  </g>

  <!-- Right side text -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="750" y="119" font-size="24" font-weight="700" fill="#49365f"
          textLength="440" lengthAdjust="spacingAndGlyphs">
      Olá, eu sou o Lucas! Bem-vindo(a) ao meu perfil!
    </text>

    <text x="750" y="174" font-size="38" font-weight="800" fill="#7659a6">
      Lucas Programando
    </text>

    <path d="M650 194 L850 194" stroke="#b49ad8" stroke-width="3" stroke-linecap="round"/>

    <text x="750" y="226" font-size="16" fill="#655778">
      ☕ Código, criatividade e aprendizado
    </text>
  </g>

  <!-- Small decorative laptop-side stars -->
  <g fill="#fff" opacity=".8">
    <path d="M580 110 L585 120 L595 124 L585 128 L580 138 L576 128 L566 124 L576 120 Z"/>
    <path d="M920 235 L924 243 L932 247 L924 251 L920 259 L916 251 L908 247 L916 243 Z"/>
    <circle cx="600" cy="210" r="3"/>
    <circle cx="880" cy="78" r="4"/>
  </g>
</svg>
